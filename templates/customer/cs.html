<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BABA AI Expert & Customer Service</title>
    
    <!-- External Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- 
    ========================================================================
    CUSTOM CSS - ENTERPRISE UI/UX
    ======================================================================== 
    -->
    <style>
        /* Base Reset & Mobile Optimizations */
        body { 
            background-color: #F8FAFC; 
            -webkit-tap-highlight-color: transparent; 
            overscroll-behavior-y: none; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        
        /* Custom Scrollbar (Hanya muncul saat discroll) */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.4); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.6); }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }

        /* Glassmorphism Effects */
        .glass-header {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(0,0,0,0.04);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.02);
        }
        
        .glass-footer {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(0,0,0,0.05);
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.03);
        }

        /* Chat Bubbles Entry Animations */
        .msg-user-enter { animation: slideLeft 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        .msg-ai-enter { animation: slideRight 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        .msg-system-enter { animation: fadeUp 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }

        @keyframes slideLeft {
            from { opacity: 0; transform: translateX(30px) scale(0.95); }
            to { opacity: 1; transform: translateX(0) scale(1); }
        }
        @keyframes slideRight {
            from { opacity: 0; transform: translateX(-30px) scale(0.95); }
            to { opacity: 1; transform: translateX(0) scale(1); }
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Typing Indicator Animation (Apple iMessage Style) */
        .typing-dot { 
            animation: typing 1.4s infinite ease-in-out both; 
            background-color: #94A3B8;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; background-color: #EAB308; }
        }

        /* Pulse Animations */
        @keyframes pulse-ring { 
            0% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); } 
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); } 
            100% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } 
        }
        .status-live { animation: pulse-ring 2s infinite; }

        /* Rich Markdown Text Styling */
        .ai-content { color: #334155; }
        .ai-content b, .ai-content strong { color: #0F172A; font-weight: 800; }
        .ai-content i, .ai-content em { color: #475569; font-style: italic; }
        .ai-content ul { list-style-type: none; padding-left: 0.25rem; margin-top: 0.75rem; margin-bottom: 0.75rem; }
        .ai-content li { position: relative; padding-left: 1.5rem; margin-bottom: 0.5rem; line-height: 1.6; }
        .ai-content li::before {
            content: "✦"; /* Elegant bullet icon */
            position: absolute; left: 0; top: 1px; font-size: 0.8rem; color: #EAB308;
        }
        .ai-content a { color: #2563EB; text-decoration: underline; text-underline-offset: 2px; font-weight: 600; transition: color 0.2s; }
        .ai-content a:hover { color: #1D4ED8; }
        .ai-content p { margin-bottom: 0.75rem; line-height: 1.6; }
        .ai-content p:last-child { margin-bottom: 0; }
        .ai-content code { background: #F1F5F9; padding: 0.1rem 0.3rem; border-radius: 0.25rem; font-size: 0.85em; color: #EF4444; font-family: monospace; }

        /* Shadows & UI Utilities */
        .soft-shadow { box-shadow: 0 2px 15px rgba(0, 0, 0, 0.04); }
        .hard-shadow { box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08); }
        .smooth-transition { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        
        /* Input Textarea Reset */
        .chat-input {
            resize: none;
            min-height: 52px;
            max-height: 140px;
        }

        /* Settings Dropdown Animation */
        .dropdown-enter { animation: dropIn 0.2s ease-out forwards; transform-origin: top right; }
        @keyframes dropIn {
            from { opacity: 0; transform: scale(0.95) translateY(-10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>

<body x-data="csStore()" x-init="initChat()" class="flex flex-col h-screen overflow-hidden text-gray-800 relative bg-[#F8FAFC]">

    <!-- 
    ========================================================================
    HEADER NAVIGATION & SETTINGS
    ======================================================================== 
    -->
    <header class="glass-header px-4 py-3 z-40 flex items-center justify-between sticky top-0 shrink-0">
        <div class="flex items-center gap-3">
            <!-- Back Button -->
            <button @click="backToHome()" class="p-2 -ml-2 bg-white border border-gray-100 rounded-full hover:bg-gray-50 transition-colors active:scale-90 shadow-[0_2px_8px_rgba(0,0,0,0.04)]">
                <i data-lucide="chevron-left" class="w-5 h-5 text-gray-700"></i>
            </button>
            
            <!-- Avatar Area -->
            <div class="relative group cursor-pointer" @click="scrollToBottom(true)">
                <div class="w-11 h-11 bg-gradient-to-br from-gray-900 via-gray-800 to-black rounded-full flex items-center justify-center shadow-md border-2 border-white transform transition-transform active:scale-95">
                    <i data-lucide="sparkles" class="w-5 h-5 text-yellow-400"></i>
                </div>
                <span class="absolute bottom-0 right-0 w-3.5 h-3.5 border-2 border-white rounded-full transition-colors duration-500" 
                      :class="chatEnded ? 'bg-red-500' : 'bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.6)]'"></span>
            </div>
            
            <!-- Status Information -->
            <div class="flex flex-col justify-center">
                <h1 class="text-[15px] font-black text-gray-900 leading-tight tracking-tight flex items-center">
                    Mimin BABA 
                    <span class="text-[9px] bg-yellow-100 text-yellow-800 px-1.5 py-0.5 rounded flex items-center ml-2 font-bold uppercase border border-yellow-200 shadow-sm">AI</span>
                </h1>
                <p class="text-[11px] font-bold uppercase tracking-widest mt-0.5 transition-colors duration-300 flex items-center gap-1" 
                   :class="chatEnded ? 'text-red-500' : 'text-emerald-500'">
                    <span x-text="headerStatus"></span>
                </p>
            </div>
        </div>
        
        <!-- Settings Menu & End Chat -->
        <div class="flex items-center gap-2 relative">
            <button @click="forceEndChat()" x-show="!chatEnded" class="p-2 bg-white text-red-500 rounded-full hover:bg-red-50 transition-all border border-gray-100 active:scale-90 shadow-sm" title="Akhiri Obrolan">
                <i data-lucide="power" class="w-4 h-4"></i>
            </button>
            
            <!-- Dropdown Toggle -->
            <button @click="showSettings = !showSettings" @click.away="showSettings = false" class="p-2 bg-white text-gray-600 rounded-full hover:bg-gray-50 transition-all border border-gray-100 active:scale-90 shadow-sm">
                <i data-lucide="more-vertical" class="w-4 h-4"></i>
            </button>

            <!-- Dropdown Menu -->
            <div x-show="showSettings" style="display: none;" class="absolute top-12 right-0 w-48 bg-white rounded-2xl shadow-xl border border-gray-100 overflow-hidden dropdown-enter z-50">
                <div class="p-3 border-b border-gray-50 bg-gray-50/50">
                    <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Pengaturan Obrolan</p>
                </div>
                <div class="p-1">
                    <button @click="toggleMute(); showSettings = false" class="w-full flex items-center gap-3 px-3 py-2.5 text-sm font-bold text-gray-700 hover:bg-gray-50 rounded-xl transition-colors text-left">
                        <i :data-lucide="isMuted ? 'volume-x' : 'volume-2'" class="w-4 h-4" :class="isMuted ? 'text-red-500' : 'text-emerald-500'"></i>
                        <span x-text="isMuted ? 'Nyalakan Suara' : 'Bisukan Suara'"></span>
                    </button>
                    <button @click="clearChatHistory(); showSettings = false" class="w-full flex items-center gap-3 px-3 py-2.5 text-sm font-bold text-red-600 hover:bg-red-50 rounded-xl transition-colors text-left mt-1">
                        <i data-lucide="trash-2" class="w-4 h-4"></i> Reset Obrolan
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- 
    ========================================================================
    MAIN CHAT AREA (Scrollable Container)
    ======================================================================== 
    -->
    <main id="chatContainer" @scroll="checkScroll()" class="flex-1 overflow-y-auto hide-scrollbar p-4 space-y-6 pb-10 relative" @touchstart="resetTimer()" @mousemove="resetTimer()">
        
        <!-- Date Badge Sticky -->
        <div class="flex justify-center my-4 sticky top-2 z-20 pointer-events-none transition-opacity duration-300" :class="isScrolling ? 'opacity-30' : 'opacity-100'">
            <span class="bg-white/90 backdrop-blur-md text-gray-500 text-[10px] font-bold px-5 py-1.5 rounded-full uppercase tracking-widest shadow-[0_2px_10px_rgba(0,0,0,0.03)] border border-gray-100/50" x-text="todayDate"></span>
        </div>

        <!-- Render Messages Loop -->
        <template x-for="(msg, index) in messages" :key="index">
            <div class="flex flex-col w-full relative msg-enter">
                
                <!-- 1. BUBBLE USER -->
                <div x-show="msg.role === 'user'" class="flex justify-end w-full mt-2">
                    <div class="flex flex-col items-end max-w-[85%] sm:max-w-[75%]">
                        <div class="bg-gray-900 text-white p-4 rounded-[1.4rem] rounded-tr-[0.3rem] shadow-[0_4px_15px_rgba(0,0,0,0.08)] border border-gray-800">
                            <p class="text-[14px] font-medium leading-relaxed break-words" x-text="msg.content"></p>
                        </div>
                        <span class="text-[10px] text-gray-400 font-bold mt-1.5 mr-2 flex items-center gap-1">
                            <span x-text="msg.time"></span>
                            <i data-lucide="check-check" class="w-3.5 h-3.5 text-blue-500"></i>
                        </span>
                    </div>
                </div>

                <!-- 2. BUBBLE AI ATAU ADMIN -->
                <div x-show="msg.role === 'model' || msg.role === 'admin'" class="flex items-end gap-3 w-full mt-2">
                    <!-- Avatar Pendamping -->
                    <div class="w-9 h-9 rounded-full flex-shrink-0 flex items-center justify-center shadow-md border-2 border-white mb-5 relative"
                         :class="msg.role === 'admin' ? 'bg-yellow-400' : 'bg-gray-900'">
                        <i :data-lucide="msg.role === 'admin' ? 'user-cog' : 'bot'" class="w-4 h-4" :class="msg.role === 'admin' ? 'text-gray-900' : 'text-yellow-400'"></i>
                        <span x-show="msg.role === 'admin'" class="absolute -bottom-1 -right-1 w-3.5 h-3.5 bg-blue-500 border-2 border-white rounded-full flex items-center justify-center">
                            <i data-lucide="check" class="w-2 h-2 text-white"></i>
                        </span>
                    </div>

                    <!-- Bubble Box -->
                    <div class="flex flex-col items-start max-w-[82%] sm:max-w-[75%]">
                        <div class="bg-white border border-gray-100 p-4 rounded-[1.4rem] rounded-tl-[0.3rem] soft-shadow relative overflow-hidden">
                            <!-- Efek Blur Latar dalam Bubble AI -->
                            <div class="absolute -top-10 -right-10 w-24 h-24 bg-yellow-50 rounded-full blur-2xl opacity-60 pointer-events-none"></div>
                            
                            <!-- Label Nama jika Admin yang membalas -->
                            <div x-show="msg.role === 'admin'" class="flex items-center gap-1.5 mb-2 bg-yellow-50 w-fit px-2 py-0.5 rounded-md border border-yellow-100">
                                <i data-lucide="shield-check" class="w-3 h-3 text-yellow-600"></i>
                                <span class="text-[9px] font-black text-yellow-700 uppercase tracking-widest">Admin Baba</span>
                            </div>
                            
                            <!-- Isi Teks (Dirender via Markdown Parser) -->
                            <div class="ai-content text-[14px] font-medium leading-relaxed break-words relative z-10" x-html="formatResponse(msg.content)"></div>
                            
                            <!-- QUICK ACTIONS BUTTONS (FIXED & IMPROVED) -->
                            <div x-show="msg.quickActions && msg.quickActions.length > 0 && !chatEnded" class="flex flex-wrap gap-2 mt-4 pt-4 border-t border-gray-50 relative z-10">
                                <p class="w-full text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1">Pilih cepat:</p>
                                <template x-for="(action, idx) in msg.quickActions" :key="idx">
                                    <button @click="sendQuickAction(action)" 
                                            class="text-[12px] bg-white text-gray-700 border border-gray-200 rounded-xl px-3.5 py-2 font-bold hover:bg-yellow-50 hover:text-yellow-700 hover:border-yellow-200 active:scale-[0.97] transition-all text-left shadow-sm flex items-center gap-1.5">
                                        <span x-text="action"></span>
                                        <i data-lucide="arrow-up-right" class="w-3 h-3 opacity-50"></i>
                                    </button>
                                </template>
                            </div>
                        </div>
                        <span class="text-[10px] text-gray-400 font-bold mt-1.5 ml-2" x-text="msg.time"></span>
                    </div>
                </div>

                <!-- 3. SYSTEM NOTIFICATION -->
                <div x-show="msg.role === 'system'" class="flex justify-center w-full my-6 msg-system-enter">
                    <div class="bg-gray-200/60 backdrop-blur-md border border-gray-200 px-5 py-2.5 rounded-full text-center max-w-[90%] shadow-sm">
                        <p class="text-[11px] font-bold text-gray-700 flex items-center gap-1.5 justify-center" x-html="msg.content"></p>
                    </div>
                </div>

                <!-- 4. FEEDBACK WIDGET (Form Penilaian) -->
                <div x-show="msg.role === 'feedback'" class="flex flex-col items-center w-full my-10 msg-system-enter">
                    
                    <div x-show="!msg.feedbackSubmitted" class="bg-white border border-gray-100 p-7 rounded-[2rem] hard-shadow w-[95%] sm:w-[80%] text-center relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-yellow-300 via-yellow-400 to-yellow-500"></div>
                        
                        <div class="w-14 h-14 bg-yellow-50 rounded-full flex items-center justify-center mx-auto mb-5 border border-yellow-100 shadow-inner">
                            <i data-lucide="star" class="w-7 h-7 text-yellow-500 fill-current"></i>
                        </div>
                        
                        <h3 class="font-black text-gray-900 text-[18px] mb-2 tracking-tight">Gimana pelayanan kami?</h3>
                        <p class="text-xs text-gray-500 font-medium mb-6 px-2 leading-relaxed">Penilaian dan saran kakak sangat berharga untuk bikin AI BABA makin pinter!</p>
                        
                        <!-- Bintang -->
                        <div class="flex justify-center gap-3 mb-6" @mouseleave="hoverRating = 0">
                            <template x-for="star in 5">
                                <button @click="selectedRating = star" 
                                        @mouseover="hoverRating = star"
                                        class="focus:outline-none transform transition-transform duration-200 active:scale-75 hover:scale-110">
                                    <i data-lucide="star" class="w-9 h-9 transition-colors duration-200" 
                                    :class="(hoverRating ? star <= hoverRating : star <= selectedRating) ? 'text-yellow-400 fill-current drop-shadow-md' : 'text-gray-200'"></i>
                                </button>
                            </template>
                        </div>

                        <!-- Textarea Complaint (FIXED: Gak bakal nyangkut lagi) -->
                        <div x-show="selectedRating > 0" 
                            x-transition:enter="transition ease-out duration-300" 
                            x-transition:enter-start="opacity-0 translate-y-4" 
                            x-transition:enter-end="opacity-100 translate-y-0" 
                            class="mb-6 w-full text-left">
                            <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2 ml-1">Masukan Tambahan</label>
                            <textarea 
                                x-model="complaintText" 
                                rows="3" 
                                placeholder="Tulis saran, kritik, atau keluhan kakak di sini (Opsional)..." 
                                class="w-full bg-gray-50 border border-gray-200 rounded-2xl text-[13px] p-4 focus:outline-none focus:ring-2 focus:ring-yellow-400 focus:bg-white transition-all resize-none shadow-inner"
                            ></textarea>
                        </div>

                        <button @click="submitFeedback(msg)" :disabled="selectedRating === 0" class="w-full bg-gray-900 text-white font-black tracking-wide text-[13px] py-4 rounded-2xl disabled:bg-gray-200 disabled:text-gray-400 transition-all shadow-lg hover:shadow-xl active:scale-95 flex justify-center items-center gap-2 group">
                            Kirim Penilaian <i data-lucide="send" class="w-4 h-4 transition-transform group-hover:translate-x-1 group-disabled:translate-x-0"></i>
                        </button>
                    </div>

                    <!-- Pilihan Setelah Selesai Dinilai -->
                    <div x-show="msg.feedbackSubmitted && chatEnded" class="mt-6 flex flex-col items-center gap-3 w-full msg-system-enter">
                        <button @click="continueChat()" class="px-8 py-4 bg-white border border-gray-200 text-gray-900 font-black tracking-wide text-[13px] rounded-full shadow-[0_4px_20px_rgba(0,0,0,0.06)] hover:shadow-[0_4px_25px_rgba(0,0,0,0.1)] active:scale-95 transition-all flex items-center gap-2.5">
                            <div class="w-6 h-6 bg-emerald-100 rounded-full flex items-center justify-center">
                                <i data-lucide="message-circle" class="w-3.5 h-3.5 text-emerald-600"></i>
                            </div>
                            Mulai Obrolan Baru
                        </button>
                        <button @click="backToHome()" class="text-[11px] text-gray-400 font-bold hover:text-gray-900 transition-colors mt-2 uppercase tracking-widest flex items-center gap-1">
                            <i data-lucide="shopping-bag" class="w-3 h-3"></i> Kembali ke Katalog
                        </button>
                    </div>
                </div>

            </div>
        </template>

        <!-- TYPING INDICATOR REALTIME -->
        <div x-show="isTyping" class="flex items-end gap-3 w-full msg-enter">
            <div class="w-9 h-9 rounded-full bg-gradient-to-br from-gray-900 to-black flex-shrink-0 flex items-center justify-center shadow-sm border-2 border-white mb-2">
                <i data-lucide="sparkles" class="w-4 h-4 text-yellow-400"></i>
            </div>
            <div class="bg-white border border-gray-100 px-5 py-4 rounded-[1.4rem] rounded-tl-[0.3rem] soft-shadow flex gap-1.5 items-center w-fit mb-2">
                <div class="w-2 h-2 rounded-full typing-dot"></div>
                <div class="w-2 h-2 rounded-full typing-dot"></div>
                <div class="w-2 h-2 rounded-full typing-dot"></div>
            </div>
        </div>
        
        <!-- Jangkar untuk Auto Scroll -->
        <div id="scrollAnchor" class="h-6 w-full"></div>
    </main>

    <!-- 
    ========================================================================
    FLOATING BUTTONS & FOOTER INPUT
    ======================================================================== 
    -->
    <!-- Tombol Scroll to Bottom -->
    <button 
        x-show="showScrollButton" 
        @click="scrollToBottom(true)" 
        x-transition:enter="transition ease-out duration-300"
        x-transition:enter-start="opacity-0 translate-y-10 scale-90"
        x-transition:enter-end="opacity-100 translate-y-0 scale-100"
        x-transition:leave="transition ease-in duration-200"
        x-transition:leave-start="opacity-100 translate-y-0 scale-100"
        x-transition:leave-end="opacity-0 translate-y-10 scale-90"
        class="absolute bottom-28 right-5 w-11 h-11 bg-white/95 backdrop-blur-md border border-gray-200 rounded-full flex items-center justify-center hard-shadow z-30 text-gray-700 hover:text-gray-900 hover:bg-gray-50 active:scale-90 transition-all">
        <i data-lucide="arrow-down" class="w-5 h-5"></i>
        <!-- Unread Badge (Optional future feature) -->
        <!-- <span class="absolute top-0 right-0 w-3 h-3 bg-red-500 border-2 border-white rounded-full"></span> -->
    </button>

    <!-- Footer Input Bar -->
    <footer class="glass-footer px-4 py-3 shrink-0 safe-bottom transition-all duration-300 z-40" 
            :class="chatEnded ? 'translate-y-full absolute opacity-0' : 'translate-y-0 relative opacity-100'">
        <form @submit.prevent="sendMessage" class="flex items-end gap-2 relative max-w-3xl mx-auto">
            
            <!-- Attachment Button (Dummy UI for Enterprise Look) -->
            <button type="button" @click="triggerAttachment()" :disabled="chatEnded || isTyping" class="shrink-0 w-11 h-11 mb-0.5 bg-gray-50 border border-gray-200 text-gray-500 rounded-full flex items-center justify-center hover:bg-gray-100 transition-colors disabled:opacity-50">
                <i data-lucide="paperclip" class="w-5 h-5"></i>
            </button>

            <!-- Textarea Fleksibel -->
            <div class="flex-1 relative bg-white border border-gray-200 rounded-3xl shadow-inner focus-within:border-yellow-400 focus-within:ring-4 focus-within:ring-yellow-400/20 transition-all overflow-hidden">
                <textarea 
                    x-ref="chatInput"
                    x-model="inputText" 
                    @keydown.enter.prevent="handleEnter" 
                    @input="autoResize(); resetTimer()" 
                    rows="1" 
                    placeholder="Tanya wangi buat ngedate..." 
                    class="w-full chat-input bg-transparent border-none text-[14px] font-medium px-4 py-3.5 focus:outline-none focus:ring-0 hide-scrollbar" 
                    :disabled="chatEnded || isTyping"
                ></textarea>
            </div>
            
            <!-- Send Button -->
            <button type="submit" :disabled="!inputText.trim() || isTyping || chatEnded" class="shrink-0 mb-0.5 w-11 h-11 bg-gray-900 hover:bg-black text-yellow-400 rounded-full flex items-center justify-center disabled:bg-gray-200 disabled:text-gray-400 transition-all shadow-md active:scale-90 group relative overflow-hidden">
                <!-- Inner glow effect -->
                <div class="absolute inset-0 bg-yellow-400/20 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                <i data-lucide="send" class="w-4 h-4 ml-0.5 mt-0.5 relative z-10 transition-transform group-hover:translate-x-0.5 group-hover:-translate-y-0.5 group-disabled:transform-none" :class="isTyping ? 'animate-pulse' : ''"></i>
            </button>
        </form>
        
        <!-- Disclaimer Text -->
        <div class="text-center mt-2.5">
            <p class="text-[9px] text-gray-400 font-bold uppercase tracking-wider">AI BABA dapat membuat kesalahan. <a href="#" class="underline decoration-gray-300 hover:text-gray-600">Cek Kebijakan</a></p>
        </div>
    </footer>

    <!-- 
    ========================================================================
    JAVASCRIPT LOGIC (ALPINE.JS & AUDIO MANAGER)
    ======================================================================== 
    -->
    <script>
        function csStore() {
            return {
                tgUser: { first_name: 'Kak', id: '' },
                messages: [],
                inputText: '',
                isTyping: false,
                chatEnded: false,
                
                showScrollButton: false,
                isScrolling: false,
                showSettings: false,
                headerStatus: 'Online & Siap Bantu',
                todayDate: new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long' }),
                
                selectedRating: 0,
                hoverRating: 0,
                complaintText: '',
                
                inactivityTimer: null,
                timeoutDuration: 600000, // 10 menit
                isMuted: false,

                initChat() {
                    try {
                        if (window.Telegram && window.Telegram.WebApp) {
                            const tg = window.Telegram.WebApp;
                            tg.ready();
                            tg.expand();

                            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                                this.tgUser = tg.initDataUnsafe.user;
                            } else {
                                this.tgUser = { first_name: 'Tester', id: 12345678 }; 
                            }
                        } else {
                            this.tgUser = { first_name: 'Guest', id: 12345678 }; 
                        }
                    } catch (e) {
                        this.tgUser = { first_name: 'Guest', id: 12345678 }; 
                    }

                    this.loadHistory();

                    document.getElementById('chatContainer').addEventListener('scroll', () => {
                        this.isScrolling = true;
                        clearTimeout(this.scrollTimeout);
                        this.scrollTimeout = setTimeout(() => { this.isScrolling = false; }, 500);
                    });

                    this.resetTimer();
                    setTimeout(() => lucide.createIcons(), 100);
                },

                playNotificationSound() {
                    if (this.isMuted) return;
                    try {
                        const AudioContext = window.AudioContext || window.webkitAudioContext;
                        if(!AudioContext) return;
                        const ctx = new AudioContext();
                        const osc = ctx.createOscillator();
                        const gainNode = ctx.createGain();
                        
                        osc.connect(gainNode);
                        gainNode.connect(ctx.destination);
                        
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(880, ctx.currentTime);
                        osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.05);
                        
                        gainNode.gain.setValueAtTime(0, ctx.currentTime);
                        gainNode.gain.linearRampToValueAtTime(0.3, ctx.currentTime + 0.02);
                        gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
                        
                        osc.start(ctx.currentTime);
                        osc.stop(ctx.currentTime + 0.3);
                    } catch(err) {}
                },

                triggerHaptic(type = 'light') {
                    if (window.Telegram && window.Telegram.WebApp.HapticFeedback) {
                        if (type === 'success') window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
                        else window.Telegram.WebApp.HapticFeedback.impactOccurred(type);
                    }
                },

                toggleMute() {
                    this.isMuted = !this.isMuted;
                    this.triggerHaptic('medium');
                },

                getCurrentTime() {
                    const now = new Date();
                    return now.getHours().toString().padStart(2, '0') + '.' + now.getMinutes().toString().padStart(2, '0');
                },

                formatHistoryTime(isoString) {
                    if (!isoString) return this.getCurrentTime();
                    const d = new Date(isoString);
                    return d.getHours().toString().padStart(2, '0') + '.' + d.getMinutes().toString().padStart(2, '0');
                },

                handleEnter(e) {
                    if (e.shiftKey) return; 
                    this.sendMessage();
                },

                autoResize() {
                    const el = this.$refs.chatInput;
                    if(!el) return;
                    el.style.height = '52px'; 
                    el.style.height = Math.min(el.scrollHeight, 140) + 'px';
                },

                checkScroll() {
                    const container = document.getElementById('chatContainer');
                    if(!container) return;
                    const distanceToBottom = container.scrollHeight - container.scrollTop - container.clientHeight;
                    this.showScrollButton = distanceToBottom > 250;
                },

                scrollToBottom(smooth = true) {
                    setTimeout(() => {
                        const anchor = document.getElementById('scrollAnchor');
                        if(anchor) anchor.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'end' });
                    }, 150);
                },

                triggerAttachment() {
                    this.messages.push({ role: 'system', content: '<i data-lucide="image" class="w-4 h-4 inline-block mr-1"></i> Fitur kirim foto/file sedang dikembangkan.' });
                    this.scrollToBottom();
                    setTimeout(() => lucide.createIcons(), 50);
                },

                resetTimer() {
                    if (this.chatEnded) return;
                    clearTimeout(this.inactivityTimer);
                    this.inactivityTimer = setTimeout(() => { this.triggerAutoEnd(); }, this.timeoutDuration);
                },

                triggerAutoEnd() {
                    if (this.chatEnded) return;
                    this.chatEnded = true;
                    this.headerStatus = "Sesi Dijeda";
                    this.messages.push({ role: 'system', content: '<i data-lucide="clock" class="w-4 h-4 inline-block mr-1"></i> Sesi dijeda otomatis karena tidak ada aktivitas. 🕒' });
                    this.showFeedbackWidget();
                },

                forceEndChat() {
                    if (this.chatEnded) return;
                    if(confirm("Jeda obrolan sebentar untuk memberi penilaian ke tim kami?")) {
                        this.chatEnded = true;
                        this.headerStatus = "Sesi Dijeda";
                        clearTimeout(this.inactivityTimer);
                        this.messages.push({ role: 'system', content: 'Obrolan dijeda sementara oleh pengguna. ✨' });
                        this.showFeedbackWidget();
                    }
                },

                clearChatHistory() {
                    if(confirm("PERINGATAN: Menghapus obrolan akan mereset memori AI. Lanjutkan?")) {
                        // 1. Tembak endpoint Hard Reset
                        fetch('/api/v1/chat/reset', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ tele_id: this.tgUser.id })
                        }).then(() => {
                            // 2. Kosongkan layar UI dan sapa ulang
                            this.messages = [];
                            this.chatEnded = false;
                            this.headerStatus = "Online & Siap Bantu";
                            this.injectWelcomeMessage();
                            this.triggerHaptic('success');
                        }).catch(e => alert("Gagal mereset database!"));
                    }
                },

                showFeedbackWidget() {
                    setTimeout(() => {
                        this.messages.push({ role: 'feedback', content: '', feedbackSubmitted: false });
                        this.scrollToBottom();
                        setTimeout(() => lucide.createIcons(), 50);
                    }, 500);
                },

                submitFeedback(msgObject) {
                    msgObject.feedbackSubmitted = true;
                    this.messages.push({ role: 'system', content: `Penilaian <b>${this.selectedRating} Bintang</b> telah dikirim. Terima kasih kak! 🙏` });
                    this.scrollToBottom();

                    fetch('/api/v1/chat/feedback', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ tele_id: this.tgUser.id, rating: this.selectedRating, complaint: this.complaintText.trim() })
                    }).catch(e => console.error(e));

                    this.triggerHaptic('success');
                },

                continueChat() {
                    this.chatEnded = false;
                    this.headerStatus = "Online & Siap Bantu";
                    this.messages.push({ role: 'system', content: '<i data-lucide="refresh-cw" class="w-4 h-4 inline-block mr-1"></i> Sesi obrolan baru dimulai. ✨' });
                    this.selectedRating = 0;
                    this.complaintText = '';
                    this.resetTimer();
                    this.scrollToBottom();
                    setTimeout(() => {
                        lucide.createIcons();
                        if(this.$refs.chatInput) {
                            this.$refs.chatInput.focus();
                            this.autoResize();
                        }
                    }, 150);
                },

                backToHome() { window.location.href = '/'; },

                injectWelcomeMessage() {
                    this.messages.push({
                        role: 'model',
                        time: this.getCurrentTime(),
                        content: `Halo kak **${this.tgUser.first_name}**! 👋\nTim BABA siap bantu.\n\nAda yang bisa kami bantu hari ini? Mau cari wangi spesifik atau butuh rekomendasi?`,
                        quickActions: ["🔥 Top Best Seller", "👨 Parfum Pria Eksekutif", "👩 Wangi Cewek Kalem", "🛍️ Cara Order"]
                    });
                    this.playNotificationSound();
                },

                loadHistory() {
                    this.headerStatus = "Menghubungkan...";
                    fetch(`/api/v1/chat/history?tele_id=${this.tgUser.id}`)
                        .then(res => {
                            if(!res.ok) throw new Error("Gagal fetch");
                            return res.json();
                        })
                        .then(data => {
                            this.headerStatus = "Online & Siap Bantu";
                            if(data.status === 'success' && data.history && data.history.length > 0) {
                                this.messages = data.history.map(m => ({
                                    ...m, 
                                    time: this.formatHistoryTime(m.created_at)
                                }));
                            } 
                            
                            // Kalau AI minta disapa lagi (karena riwayat kosong atau udah lewat 2 jam)
                            if (data.needs_greeting) {
                                this.injectWelcomeMessage();
                            }
                            
                            this.scrollToBottom(false);
                            setTimeout(() => lucide.createIcons(), 50);
                        })
                        .catch(() => {
                            this.headerStatus = "Mode Offline";
                            this.injectWelcomeMessage();
                            setTimeout(() => lucide.createIcons(), 50);
                        });
                },

                sendQuickAction(text) {
                    this.inputText = text;
                    this.sendMessage();
                },

                sendMessage() {
                    const text = this.inputText.trim();
                    if (!text || this.isTyping || this.chatEnded || !this.tgUser.id) return;
                    
                    this.resetTimer();
                    this.messages.push({ role: 'user', content: text, time: this.getCurrentTime() });
                    
                    this.inputText = '';
                    if(this.$refs.chatInput) this.$refs.chatInput.style.height = '52px';
                    
                    this.isTyping = true;
                    this.headerStatus = "Mimin sedang mengetik...";
                    this.scrollToBottom();

                    this.messages.forEach(m => { if (m.quickActions) m.quickActions = null; });

                    fetch('/api/v1/chat/send', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ tele_id: this.tgUser.id, message: text })
                    })
                    .then(res => res.json())
                    .then(data => {
                        this.isTyping = false;
                        this.headerStatus = "Online & Siap Bantu";
                        
                        if (data.status === 'success') {
                            this.messages.push({ role: 'model', content: data.reply, time: this.getCurrentTime() });
                            this.triggerHaptic('light');
                            this.playNotificationSound(); 
                        } else {
                            this.messages.push({ role: 'system', content: `<b class="text-red-500">Gagal:</b> ${data.message || 'Sistem error.'}` });
                        }
                        this.scrollToBottom();
                        setTimeout(() => lucide.createIcons(), 50);
                    })
                    .catch(() => {
                        this.isTyping = false;
                        this.headerStatus = "Koneksi Bermasalah";
                        this.messages.push({ role: 'system', content: 'Koneksi terputus. Silakan periksa jaringan.' });
                        this.scrollToBottom();
                    });
                },

                formatResponse(text) {
                    if(!text) return '';
                    let formatted = text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
                    formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<b class="text-gray-900">$1</b>');
                    formatted = formatted.replace(/(?<!\*)\*(?!\*)(.*?)\*(?!\*)/g, '<i>$1</i>');
                    formatted = formatted.replace(/~~(.*?)~~/g, '<del class="text-gray-400">$1</del>');
                    formatted = formatted.replace(/`(.*?)`/g, '<code>$1</code>');
                    formatted = formatted.replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer" class="flex items-center gap-1 inline-flex">$1 <i data-lucide="external-link" class="w-3 h-3"></i></a>');
                    formatted = formatted.replace(/^- (.*)$/gm, '<li>$1</li>');
                    formatted = formatted.replace(/(<li>.*<\/li>\n?)+/g, match => `<ul>${match}</ul>`);
                    formatted = formatted.replace(/\n(?!\s*<li>|<ul)/g, '<br>');
                    return formatted;
                }
            }
        }
    </script>
</body>
</html>
